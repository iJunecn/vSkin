name: vskin

services:
  app:
    build:
      context: .
      dockerfile: skin-backend/Dockerfile
      network: host
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
        - VITE_API_BASE=${VITE_API_BASE:-/skinapi}
        - BUILD_MODE=${BUILD_MODE:-standard}
    container_name: vskin
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - vskin_data:/data
    environment:
      - SERVER__ROOT_PATH=${SERVER__ROOT_PATH:-/skinapi}
      - DATABASE__PATH=/data/yggdrasil.db
      - KEYS__PRIVATE_KEY=/data/private.pem
      - TEXTURES__DIRECTORY=/data/textures
      - CAROUSEL__DIRECTORY=/data/carousel

volumes:
  vskin_data:
